[pytest]
# 執行方式（在 backend/ 目錄下）：
#   python -m venv .venv && .venv/bin/pip install -r requirements-test.txt
#   .venv/bin/python -m pytest
#
# pythonpath = . 讓 tests/ 能 import app 與 services（app.py 用的是
# `from services.common import ...`，必須把 backend/ 本身放進 sys.path）。
pythonpath = .
testpaths = tests
addopts = -ra --strict-markers
markers =
    slow: 需要數秒 CPU 的測試（PDF 點陣渲染）
    needs_tesseract: 需要系統安裝 tesseract 才能執行
