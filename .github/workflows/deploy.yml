# NOTE: funnytools.win is currently proxied by Cloudflare, but the origin response
# path uses GitHub Pages/Fastly. Keep this GitHub Pages workflow deployable and
# verify public sitemap/robots output against the custom domain after release.
name: Deploy Astro site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh Amazon Product Advertising Content
        run: npm run amazon:refresh
        env:
          AMAZON_AFFILIATE_BOOTSTRAP_MODE: auto
          AMAZON_CREATORS_API_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_API_CLIENT_ID }}
          AMAZON_CREATORS_API_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_API_CLIENT_SECRET }}
          AMAZON_CREATORS_API_VERSION: ${{ secrets.AMAZON_CREATORS_API_VERSION }}
          AMAZON_CREATORS_API_MARKETPLACE: www.amazon.com

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          AMAZON_AFFILIATE_BOOTSTRAP_MODE: auto

      - name: Generate deployment sitemaps
        run: node scripts/generate-sitemaps.mjs
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Validate sitemap URLs
        run: node scripts/validate-indexable-urls.mjs

      # The manifest is created from the same build that is uploaded to Pages below, so the
      # URLs submitted after deploy are exactly the ones that were validated and deployed.
      # Scheduled (6-hourly) redeploys do not submit indexing signals, so skip it there.
      - name: Create validated indexing submission manifest
        if: github.event_name != 'schedule'
        run: node scripts/create-indexing-submission-manifest.mjs

      - name: Upload indexing submission manifest
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: indexing-submission-manifest
          path: reports/indexing-submission-manifest.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  # Runs in this workflow (not a separate push-triggered one) so a single push produces a single
  # run and indexing signals can never be cancelled by the shared `pages` concurrency group.
  # Depends on `deploy` only: a flaky backend smoke must not suppress indexing submissions.
  submit-indexing:
    name: Submit indexing signals
    needs: deploy
    if: github.event_name != 'schedule' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download validated indexing submission manifest
        uses: actions/download-artifact@v4
        with:
          name: indexing-submission-manifest
          path: reports

      - name: Submit IndexNow URLs
        run: node scripts/submit-indexnow.mjs
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Submit Bing URLs
        if: always()
        run: node scripts/submit-bing-urls.mjs
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}

      - name: Submit sitemap to Google Search Console
        if: always()
        run: node scripts/gsc-submit-sitemaps.mjs
        env:
          FABLE_OPS_OAUTH_CLIENT_JSON: ${{ secrets.FABLE_OPS_OAUTH_CLIENT_JSON }}
          FABLE_OPS_REFRESH_TOKEN: ${{ secrets.FABLE_OPS_REFRESH_TOKEN }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_CLIENT_EMAIL: ${{ secrets.GSC_CLIENT_EMAIL }}
          GSC_PRIVATE_KEY: ${{ secrets.GSC_PRIVATE_KEY }}

      - name: Upload SEO reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-indexing-reports
          path: reports/

      - name: Summarize deployment and indexing signal state
        if: always()
        run: |
          {
            echo '## SEO indexing automation';
            echo;
            echo '- Deployment job: PASS (this submit job only runs after build/deploy succeeds).';
            if [ -f reports/gsc-sitemap-submit-report.json ]; then
              node -e "const r=require('./reports/gsc-sitemap-submit-report.json'); console.log('- Indexing signal: '+(r.status||'UNKNOWN')+' — '+(r.message||''));";
            else
              echo '- Indexing signal: NOT_AVAILABLE';
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  production-smoke:
    name: Post-deploy production API smoke
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    # 就緒等待最多 4 分鐘，加上測試本身，15 分鐘足夠且能擋住卡死。
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lightweight production smoke
        env:
          FUNNYTOOLS_SMOKE_BASE: https://api.funnytools.win
          FUNNYTOOLS_SMOKE_PROFILE: production
          FUNNYTOOLS_SMOKE_RETRIES: 3
          FUNNYTOOLS_SMOKE_RETRY_DELAY_MS: 15000
          # 後端 container 不由本 workflow 部署，重啟後就緒需要數分鐘；
          # 先用有上限的窗口輪詢 /health，再跑其餘 API 斷言。
          FUNNYTOOLS_SMOKE_READY_TIMEOUT_MS: 240000
          FUNNYTOOLS_SMOKE_READY_POLL_MS: 10000
        run: |
          set -o pipefail
          if npm run test:api; then
            echo "DEPLOY SUCCESS"
            echo "PRODUCTION SMOKE PASS"
          else
            echo "::error::PRODUCTION SMOKE FAIL (DEPLOY SUCCESS)"
            exit 1
          fi
