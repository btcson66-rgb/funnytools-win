name: Conversion API production smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: conversion-api-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lightweight production smoke
        env:
          FUNNYTOOLS_SMOKE_BASE: https://api.funnytools.win
          FUNNYTOOLS_SMOKE_PROFILE: production
          FUNNYTOOLS_SMOKE_RETRIES: 3
          FUNNYTOOLS_SMOKE_RETRY_DELAY_MS: 15000
        run: npm run test:api
