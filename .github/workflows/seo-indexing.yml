# Push-triggered deploy + indexing submission now live in deploy.yml (deploy -> submit-indexing),
# so one push produces one workflow run. This workflow is only for:
#   - workflow_dispatch: manually re-send indexing signals for the checked-out main (build only,
#     NO Pages deploy) and run the weekly URL inspection;
#   - schedule: weekly GSC URL inspection (unchanged).
# It deliberately does not use the `pages` concurrency group: it never deploys, and sharing the
# group would let a manual/scheduled run occupy the pending slot and cancel a real deploy.
name: SEO indexing automation

on:
  workflow_dispatch:
  schedule:
    - cron: '24 18 * * 0'

# No Pages deploy happens here, so no pages/id-token scopes are needed.
permissions:
  contents: read

concurrency:
  group: seo-indexing
  cancel-in-progress: false

jobs:
  build-manifest:
    name: Build validated indexing submission manifest (no deploy)
    if: github.event_name != 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Generate deployment sitemaps
        run: node scripts/generate-sitemaps.mjs
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Validate sitemap URLs
        run: node scripts/validate-indexable-urls.mjs

      - name: Create validated indexing submission manifest
        run: node scripts/create-indexing-submission-manifest.mjs

      - name: Upload indexing submission manifest
        uses: actions/upload-artifact@v4
        with:
          name: indexing-submission-manifest
          path: reports/indexing-submission-manifest.json

  submit-indexing:
    name: Submit indexing signals
    if: github.event_name != 'schedule' && needs.build-manifest.result == 'success'
    needs: build-manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download validated indexing submission manifest
        uses: actions/download-artifact@v4
        with:
          name: indexing-submission-manifest
          path: reports

      - name: Submit IndexNow URLs
        run: node scripts/submit-indexnow.mjs
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Submit Bing URLs
        if: always()
        run: node scripts/submit-bing-urls.mjs
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}

      - name: Submit sitemap to Google Search Console
        if: always()
        run: node scripts/gsc-submit-sitemaps.mjs
        env:
          FABLE_OPS_OAUTH_CLIENT_JSON: ${{ secrets.FABLE_OPS_OAUTH_CLIENT_JSON }}
          FABLE_OPS_REFRESH_TOKEN: ${{ secrets.FABLE_OPS_REFRESH_TOKEN }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_CLIENT_EMAIL: ${{ secrets.GSC_CLIENT_EMAIL }}
          GSC_PRIVATE_KEY: ${{ secrets.GSC_PRIVATE_KEY }}

      - name: Upload SEO reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-indexing-reports
          path: reports/

      - name: Summarize deployment and indexing signal state
        if: always()
        run: |
          {
            echo '## SEO indexing automation';
            echo;
            echo '- Manual resubmission: no Pages deploy was performed by this run; manifest built from the checked-out main.';
            if [ -f reports/gsc-sitemap-submit-report.json ]; then
              node -e "const r=require('./reports/gsc-sitemap-submit-report.json'); console.log('- Indexing signal: '+(r.status||'UNKNOWN')+' — '+(r.message||''));";
            else
              echo '- Indexing signal: NOT_AVAILABLE';
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  weekly-inspection:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Generate sitemaps
        run: node scripts/generate-sitemaps.mjs

      - name: Validate sitemap URLs
        run: node scripts/validate-indexable-urls.mjs

      - name: Inspect priority URLs with GSC URL Inspection API
        run: node scripts/gsc-inspect-priority-urls.mjs
        env:
          # Preferred: the backup account is siteOwner on all three properties. The service
          # account below only ever reached worthcalc — Search Console will not accept it as a
          # user on the other two — so on its own this step fails for funnytools.
          FABLE_OPS_OAUTH_CLIENT_JSON: ${{ secrets.FABLE_OPS_OAUTH_CLIENT_JSON }}
          FABLE_OPS_REFRESH_TOKEN: ${{ secrets.FABLE_OPS_REFRESH_TOKEN }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_CLIENT_EMAIL: ${{ secrets.GSC_CLIENT_EMAIL }}
          GSC_PRIVATE_KEY: ${{ secrets.GSC_PRIVATE_KEY }}

      - name: Upload weekly indexing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-indexing-report
          path: reports/
